upstream estatutos_app {
    server app:8000;
}

server {
    listen 8546 ssl;
    http2 on;
    server_name sistemas.coopetrol.coop;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Si alguien entra por http:// al puerto 8546, se redirige a https://
    error_page 497 =301 https://$host:8546$request_uri;

    # Igual a MAX_CONTENT_LENGTH de Flask (PDF del Estatuto / base de asociados).
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        return 301 https://$host:8546/estatutos/;
    }

    location = /estatutos {
        return 301 https://$host:8546/estatutos/;
    }

    location /estatutos/ {
        proxy_pass http://estatutos_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  8546;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /estatutos/static/ {
        proxy_pass http://estatutos_app;
        proxy_set_header Host $host;
        expires 1h;
    }
}
